# ============================================================================
# JVM Memory Configuration - Optimized for Windows multi-module Android builds
# ============================================================================
# Primary heap: 5GB (enough for dex merging without excessive GC)
# Metaspace: 768MB (Android Gradle Plugin + Kotlin compiler metadata)
# Direct Memory: 512MB (shader compilation, native resources)
# ============================================================================
org.gradle.jvmargs=-Xmx5g \
  -XX:MaxMetaspaceSize=768m \
  -XX:CompressedClassSpaceSize=256m \
  -XX:MaxDirectMemorySize=512m \
  -XX:+UseG1GC \
  -XX:MaxGCPauseMillis=200 \
  -XX:+ParallelRefProcEnabled \
  -XX:+UnlockDiagnosticVMOptions \
  -XX:G1NewCollectionHeuristicPercent=20 \
  -XX:+HeapDumpOnOutOfMemoryError \
  -XX:HeapDumpPath=build/heapdump.hprof \
  -Dfile.encoding=UTF-8

# ============================================================================
# Gradle Daemon Configuration - Prevents repeated startup overhead
# ============================================================================
# Keep daemon alive for 3 hours (10800 seconds) for local development
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# ============================================================================
# Android Configuration
# ============================================================================
# Use AndroidX libraries (required for modern Android development)
android.useAndroidX=true

# Jetifier for legacy library support (optional, minimal performance impact)
android.enableJetifier=true

# Disable unnecessary features to reduce build time
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=true
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# ============================================================================
# Performance Optimizations
# ============================================================================
# Enable Gradle build cache to reuse task outputs across builds
org.gradle.caching=true

# Use parallel builds for multi-module projects
org.gradle.parallel=true

# Set optimal number of workers for your system (Windows typically uses all cores - 1)
org.gradle.workers.max=7

# Pre-compile Java modules in parallel
org.gradle.configureondemand=false

# ============================================================================
# Build Logging & Debugging
# ============================================================================
# Show detailed task execution for troubleshooting (set to false for production CI/CD)
org.gradle.logging.level=info

# Suppress redundant task output
org.gradle.console=rich
